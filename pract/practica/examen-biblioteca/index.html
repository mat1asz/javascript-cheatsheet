<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteca Comunitaria - Examen de JavaScript</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <div class="biblioteca-container">
      <header>
        <h1>📚 Biblioteca Comunitaria</h1>
        <p class="subtitle">Pedí prestado tu próximo libro favorito</p>
      </header>

      <section class="filters">
        <select id="filtroGenero" class="filter-select">
          <option value="">Todos los géneros</option>
        </select>
      </section>

      <!-- ========================================================================= -->
      <!-- 📋 PLANTILLA PARA COPIAR Y PEGAR EN JS (Renderizado de tarjetas en Grid): -->
      <!--
        <div class="libro-card">
          <div class="card-image-wrap">
            <img src="${libro.imagen}" alt="${libro.titulo}" class="card-image" />
            <span class="card-genre-badge badge-${libro.genero}">${libro.genero}</span>
            <span class="card-copies-badge">${libro.copiasDisponibles} disp.</span>
          </div>
          <div class="card-body">
            <h3 class="card-title">${libro.titulo}</h3>
            <p class="card-author">${libro.autor} &bull; ${libro.año}</p>
            <p class="card-shelf"><i class="fas fa-map-marker-alt"></i> Estantería ${libro.estanteria}</p>
            <p class="card-synopsis">${libro.sinopsis}</p>
            <button type="button" class="btn-primary btn-solicitar" data-id="${libro.id}">
              <i class="fas fa-book-reader"></i> Ver Ficha y Solicitar
            </button>
          </div>
        </div>
      -->
      <!-- ========================================================================= -->

      <section class="catalog">
        <div id="catalogoGrid" class="cards-grid"></div>
      </section>

      <!-- Modal Ficha y Préstamo -->
      <div id="modalDetalle" class="modal hidden">
        <div class="modal-content">
          <div class="modal-header">
            <h3>📚 Ficha y Solicitud de Préstamo</h3>
            <button type="button" class="cerrar-modal">&times;</button>
          </div>

          <!-- ======================================================================= -->
          <!-- 📋 PLANTILLA PARA COPIAR Y PEGAR EN JS (Detalle del libro en modal):    -->
          <!--
            <div class="detail-header-info">
              <img src="${libro.imagen}" alt="${libro.titulo}" class="detail-img" />
              <div>
                <h4>${libro.titulo} (${libro.año})</h4>
                <div class="detail-meta-grid">
                  <div class="detail-meta-item"><strong>Autor:</strong> ${libro.autor}</div>
                  <div class="detail-meta-item"><strong>Páginas:</strong> ${libro.paginas}</div>
                  <div class="detail-meta-item"><strong>Estantería:</strong> ${libro.estanteria}</div>
                  <div class="detail-meta-item"><strong>Disponibles:</strong> ${libro.copiasDisponibles}</div>
                </div>
              </div>
            </div>
            <div class="detail-history">
              <strong>Sinopsis:</strong> ${libro.sinopsis}
            </div>
          -->
          <!-- ======================================================================= -->

          <div id="detalleContent" class="detail-body"></div>

          <form id="formPrestamo" class="prestamo-form">
            <h4><i class="fas fa-id-card"></i> Datos del Solicitante</h4>
            <div class="form-grid">
              <div class="form-group">
                <label for="inputNombreSolicitante">Nombre y Apellido</label>
                <input
                  type="text"
                  id="inputNombreSolicitante"
                  name="nombreSolicitante"
                  required
                  placeholder="Ej: Carla Fernández"
                />
              </div>
              <div class="form-group">
                <label for="inputDni">DNI</label>
                <input
                  type="text"
                  id="inputDni"
                  name="dni"
                  required
                  placeholder="Ej: 38456123"
                />
              </div>
            </div>
            <button type="submit" id="btnConfirmarPrestamo" class="btn-primary">
              <i class="fas fa-book-reader"></i> Confirmar Préstamo
            </button>
          </form>
          <button type="button" class="btn-cerrar cerrar-modal">Cerrar</button>
        </div>
      </div>

      <!-- Sección Historial de Préstamos -->
      <section class="prestamos-section">
        <div class="prestamos-header">
          <h2><i class="fas fa-clipboard-list"></i> Mis Préstamos Solicitados</h2>
          <button type="button" id="btnLimpiarPrestamos" class="btn-outline">
            <i class="fas fa-trash"></i> Limpiar Historial
          </button>
        </div>

        <!-- ======================================================================= -->
        <!-- 📋 PLANTILLA PARA COPIAR Y PEGAR EN JS (Item de Préstamo guardado):     -->
        <!--
          <div class="prestamo-card">
            <div class="prestamo-info">
              <h4>📚 Préstamo de: ${p.tituloLibro} (${p.genero})</h4>
              <p><strong>Solicitante:</strong> ${p.solicitante} &bull; <strong>DNI:</strong> ${p.dni} &bull; <strong>Fecha:</strong> ${p.fecha}</p>
            </div>
            <span class="prestamo-badge">Pendiente de Retiro</span>
          </div>
        -->
        <!-- ======================================================================= -->

        <div id="prestamosLista" class="prestamos-list"></div>
      </section>
    </div>
    <script src="js/script.js" defer></script>
  </body>
</html>
